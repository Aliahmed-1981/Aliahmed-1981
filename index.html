<style>
:root{--navy:#173B5E;--teal:#26806F;--gold:#C0993F;--violet:#7c5cff;--pink:#ec4899;--sky:#0ea5e9;--amber:#f59e0b;--green:#22a06b;--coral:#ef6a55;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Poppins,system-ui,sans-serif}
[dir=rtl] body,body[dir=rtl]{font-family:Cairo,Poppins,sans-serif}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));z-index:99;transition:width .25s}
header{background:linear-gradient(100deg,var(--navy),var(--teal));color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
header img{height:44px;background:#fff;border-radius:10px;padding:3px}
header .ti{flex:1;min-width:160px;text-align:center}header .ti b{display:block;font-size:17px}header .ti small{opacity:.85}
#cc{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
#cc b{display:inline-block;min-width:20px;text-align:center;border-radius:99px;padding:0 6px;margin:0 2px}#cc .e{background:var(--bad)}#cc .w{background:var(--amber);color:#222}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
nav.tabs,nav.sub{display:flex;gap:8px;padding:12px 20px 0;flex-wrap:wrap}
nav.sub{padding:0 0 12px}
.pill{border:0;background:var(--sf);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font:inherit;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--sh);white-space:nowrap}
.pill.on{background:var(--navy);color:#fff}.pill:hover:not(.on){background:var(--hl)}
main{padding:14px 20px 90px}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;gap:12px;align-items:center;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;cursor:pointer;border:0;font:inherit;color:inherit;text-align:start}
.kpi i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal}.kpi b{font-size:22px;display:block;line-height:1.1}.kpi small{color:var(--mut)}
.bar{position:sticky;top:0;z-index:5;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar label{color:var(--mut);font-size:12px}
select,input[type=text],input[type=number],input[type=time],input[type=email],input:not([type]){font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;max-width:100%}
input[type=color]{width:42px;height:32px;border:1px solid var(--ln);border-radius:8px;padding:2px;background:none}
button.b{font:inherit;border:0;border-radius:10px;padding:7px 14px;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--ln);display:inline-flex;gap:6px;align-items:center}
button.b:hover{background:var(--hl)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}button.dng{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden}.seg button{border:0;background:var(--sf);color:var(--ink);padding:7px 12px;cursor:pointer;font:inherit;display:inline-flex;gap:6px;align-items:center}.seg button.on{background:var(--navy);color:#fff}
.pbox{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.pdrop{width:100%;max-width:760px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.08)}.pdrop input[type=search]{width:100%;box-sizing:border-box}.pdrop .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.plist{max-height:260px;overflow:auto;border-top:1px solid var(--ln);padding-top:6px}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;background:var(--bg);margin:2px}
.tag.e{background:var(--bads);color:var(--bad)}.tag.w{background:var(--wns);color:var(--wn)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.sc{overflow:auto}
table.ed{border-collapse:collapse;width:100%}table.ed th{background:var(--bg);text-align:start;padding:6px 8px;position:sticky;top:0;font-weight:600;font-size:12px}
table.ed td{border-bottom:1px solid var(--ln);padding:3px 4px}table.ed td input,table.ed td select{width:100%}
table.ed tr:hover td{background:var(--hl);box-shadow:inset 3px 0 0 var(--amber)}
.msg{color:var(--mut)}
/* ---------- timetable tables (same design as the PDFs) ---------- */
.tt{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff;color:#111;font-family:"DejaVu Sans","Liberation Sans",Arial,sans-serif;margin-bottom:12px}
#v .tt{font-size:12.5px;min-width:900px}
.tt th,.tt td{border:1px solid #333;padding:.2em .25em;text-align:center;vertical-align:middle;overflow:hidden;word-wrap:break-word;min-width:0;background:#fff;color:#111}
.tt col.cd{width:8.5em}.tt col.cl{width:5.6em}
.tt tr.h>th.hd{background:#e6ebf3;color:#1f3a68;font-size:.82em;font-weight:400;line-height:1.25;padding:.2em .1em}
.tt th.hd b{display:block;font-size:1.08em;font-weight:700}.tt th.hd.brk{background:#c9cdd4}
.tt th.dy{background:#f2f4f7;font-weight:700}.tt th.dy small{display:block;font-weight:400;font-size:.78em;color:#444;margin-top:.2em}.tt th.dy small b{display:inline;color:#1f3a68}
.tt th.lv{background:#f2f4f7;color:#1f3a68;font-size:.8em;font-weight:700}
.tt tr.ct>td{height:5.6em;font-size:.92em;line-height:1.2;vertical-align:top;padding:.15em}
.tt tr.ct>td.bk{background:#d9dce1;font-weight:700;letter-spacing:.04em;font-size:.85em;vertical-align:middle}
.tt td.sel{cursor:pointer}
.tt td.sel:hover{background:var(--hl);box-shadow:inset 0 -3px 0 var(--amber)}
.en{position:relative;text-align:start;border-radius:6px;border-inline-start:3px solid var(--sc,#888);background:var(--sb,#f4f4f4);padding:.1em .3em;margin:.12em 0;cursor:grab}
.en:hover{background:var(--hl);box-shadow:inset 3px 0 0 var(--amber)}
.en b{display:block;font-size:1.02em;line-height:1.15;color:#000}.en i{display:block;font-style:normal;font-size:.8em;color:#333}
.en i.un{color:#b42318;font-style:italic}.si{display:inline-block;margin-inline-end:.28em;font-size:1.15em;line-height:1;vertical-align:-.12em}img.si{height:1.3em;width:1.3em;object-fit:contain;border-radius:3px}
.en small{display:block;font-size:.7em;color:#6b4e00;font-weight:700}
.en.bad{box-shadow:inset 0 0 0 2px var(--bad);background:#fff0f0}.en.wn{box-shadow:inset 0 0 0 2px #d18a00;background:#fff7e6}
.cb{position:absolute;top:1px;inset-inline-end:2px;width:15px;height:15px;border-radius:50%;font:700 10px/15px Poppins,sans-serif;text-align:center;color:#fff;cursor:pointer;text-decoration:none}
.cb.e{background:var(--bad)}.cb.w{background:var(--amber);color:#222}
.more{display:inline-block;background:#173B5E;color:#fff;border-radius:99px;font-size:.75em;padding:0 .5em;margin-top:.1em;cursor:pointer}
.lk{font-size:.7em}
.tt td.over{outline:3px dashed var(--teal);outline-offset:-3px}
.abn{font-size:12px;color:#333;padding:4px 2px}
.vh{display:flex;gap:10px;align-items:center;margin:8px 0}.vh h3{margin:0}
/* ---------- drawer ---------- */
#dr{position:fixed;top:0;inset-inline-end:0;height:100%;width:min(460px,100%);background:var(--sf);box-shadow:-6px 0 28px rgba(0,0,0,.25);z-index:60;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column}
[dir=rtl] #dr{transform:translateX(-105%);box-shadow:6px 0 28px rgba(0,0,0,.25)}#dr.open{transform:none}
#dr .hd{background:linear-gradient(100deg,var(--navy),var(--teal));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
#dr .bd{padding:12px;overflow:auto;flex:1}#dr .ft{padding:10px 12px;border-top:1px solid var(--ln);display:flex;gap:8px;position:sticky;bottom:0;background:var(--sf)}
.ent{border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px;border-inline-start:5px solid var(--sc,#888)}
.ent .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.ent .row>label{color:var(--mut);font-size:12px;min-width:64px}
.chip{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
.chip.add{background:transparent;color:var(--teal)}.chip.na{background:var(--amber);border-color:var(--amber);color:#222}
.lnk{color:var(--sky);cursor:pointer;background:none;border:0;font:inherit;padding:0;text-decoration:underline}
.hint{background:var(--wns);color:var(--wn);border-radius:10px;padding:6px 10px;font-size:12px;margin:6px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--sh)}#toast div.bad{background:var(--bad)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cfl{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding:9px 4px;flex-wrap:wrap}.cfl:hover{background:var(--hl);box-shadow:inset 3px 0 0 var(--amber)}.cfl .tx{flex:1;min-width:220px}.cfl.ig{opacity:.55}
/* ---------- print ---------- */
#pa{display:none}
#pa .sheet{box-sizing:border-box;font-size:var(--fs,10.7px);color:#111;background:#fff}
#pa .tt{font-size:1em;margin:0}#pa .en{cursor:default;background:var(--sb,#f4f4f4)}#pa .more{display:none}
#pa .print-head{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #1f3a68;padding:0 0 6px;margin-bottom:6px;color:#1f3a68;gap:16px}
#pa .print-brand{display:flex;align-items:center;gap:10px;font-size:15px}#pa .print-brand img{max-height:48px;max-width:100px}
#pa .print-brand small,#pa .print-title small{display:block;font-size:10px;color:#394b64;font-weight:400}
#pa .print-title{text-align:right}#pa .print-title>b{display:block;font-size:1.9em;color:#1f3a68}
#pa .print-foot{display:flex;justify-content:space-between;border-top:1px solid #9aa8b8;margin-top:7px;padding-top:4px;font-size:.8em;color:#394b64}
@media print{html,body{width:auto}#pa .sheet{overflow:hidden;max-width:100%}@page{size:A4 landscape;margin:7mm 8mm 9mm 8mm}body>*:not(#pa){display:none!important}#pa{display:block}#pa .sheet{page-break-after:always}#pa .sheet:last-child{page-break-after:auto}body{background:#fff}}
@media (max-width:700px){main{padding:10px}header .ti{order:3;flex-basis:100%}}
</style>

/* ===================== 1. CORE: state, helpers, server calls, indexes ===================== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lc = s => String(s == null ? '' : s).trim().toLowerCase();
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const AB_B = [1, 4];                       // G12 only: B Days are Monday/Thursday, the rest are A Days
const pad = n => String(n).padStart(2, '0');
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const pt = m => { let q = Math.floor(m / 60); if (q > 12) q -= 12; return q + ':' + pad(m % 60) };
const toMin = t => { const m = String(t).match(/(\d{1,2}):?(\d{2})?/); return m ? +m[1] * 60 + +(m[2] || 0) : 0 };
const short = n => String(n || '').split(' ').slice(0, 2).join(' ');
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });
let S = null, I = {};                      // S = server snapshot, I = derived indexes
let HL = 'en'; try { HL = localStorage.getItem('hl') || 'en' } catch (e) { }
let PRINT = false;                         // printing hides conflicts and drag handles

/* ---------- server calls with progress bar + toast ---------- */
let busyN = 0;
function busy(d) { busyN += d; $('#bar').style.width = busyN > 0 ? '70%' : '100%'; if (busyN <= 0) setTimeout(() => { if (busyN <= 0) $('#bar').style.width = '0' }, 250) }
function toast(m, bad) { const d = document.createElement('div'); d.textContent = m; if (bad) d.className = 'bad'; $('#toast').appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 2600) }
function srv(fn, ...a) {
  return new Promise((ok, no) => {
    busy(1);
    google.script.run.withSuccessHandler(r => { busy(-1); ok(r) }).withFailureHandler(e => { busy(-1); toast(String((e && e.message) || e).replace(/^Error:\s*/, ''), 1); no(e) })[fn](...a)
  });
}

/* ---------- derived indexes (rebuilt after every server answer) ---------- */
function index() {
  I = { days: S.set.days.map(Number).sort((a, b) => a - b), sch: {}, cs: {}, tn: {}, lang: {}, col: {}, ico: {}, cell: {}, byId: {}, cf: {}, byT: {}, ign: new Set(S.ignored) };
  S.sch.forEach(r => { const g = (I.sch[r[0]] = I.sch[r[0]] || {}); (g[r[1]] = g[r[1]] || []).push({ k: +r[2], label: r[3], s: toMin(r[4]), e: toMin(r[5]), brk: /^y/i.test(r[6]) }) });
  for (const g in I.sch) for (const d in I.sch[g]) I.sch[g][d].sort((a, b) => a.k - b.k);
  S.cls.forEach(r => I.cs[r[0]] = r[1]);
  I.classes = Object.keys(I.cs).sort(natural);
  S.tch.forEach(r => { I.tn[r[0]] = r[1]; if (r[4]) I.lang[r[0]] = r[4] });
  S.subj.forEach(r => { if (r[1]) I.col[lc(r[0])] = r[1]; if (r[2]) I.ico[lc(r[0])] = r[2] });
  S.lessons.forEach(l => {
    l.sl = slotOf(l.c, l.d, l.p);
    I.byId[l.id] = l; const k = l.c + '|' + l.d + '|' + l.p; (I.cell[k] = I.cell[k] || []).push(l);
    if (l.sl && !l.sl.brk) l.t.forEach(t => (I.byT[t + '|' + l.d] = I.byT[t + '|' + l.d] || []).push(l));
  });
  S.conflicts.list.forEach(c => { if (c.ign) return; c.ids.forEach(id => (I.cf[id] = I.cf[id] || []).push(c)) });
}
const slotOf = (c, d, p) => (((I.sch[I.cs[c]] || {})[d]) || []).find(x => x.k == p) || null;
const cellL = (c, d, p) => I.cell[c + '|' + d + '|' + p] || [];
const tname = id => I.tn[id] || id;
const dayName = d => t(DAYS[d]);
const dayDate = d => { const x = new Date(S.week.sun + 'T00:00:00'); x.setDate(x.getDate() + d); return x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) };
const isG12 = g => /^G12$/i.test(g);
const stageOf = c => I.cs[c];
const stages = () => [...new Set(I.classes.map(stageOf))];
const gW = g => { let m = 1; for (const d in (I.sch[g] || {})) I.sch[g][d].forEach(x => { if (x.k > m) m = x.k }); return m };
function slotsOf(g, d, W) {                // slot k spans until the next slot number; the last one reaches W
  const a = (I.sch[g] || {})[d] || [];
  return a.map((x, i) => ({ k: x.k, x, sp: (i + 1 < a.length ? a[i + 1].k : W + 1) - x.k }));
}
/* subject picture: an emoji from the library, or a small uploaded image (see Icons.html) */
const subjIco = s => { const v = I.ico[lc(s)]; return !v ? '' : /^data:image\//.test(v) ? `<img class="si" src="${esc(v)}" alt="">` : `<span class="si">${esc(v)}</span>` };
function subjCol(s) {                      // colour per subject: set in Subjects, else a stable hash colour
  const c = I.col[lc(s)];
  if (c) return { c, b: c + '33' };
  let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return { c: `hsl(${h} 55% 42%)`, b: `hsl(${h} 70% 93%)` };
}
const assignedOf = (c, s) => {
  const rows = S.asg.filter(r => r[0] == c && lc(r[1]) == lc(s) && !/^n/i.test(r[5]));
  rows.sort((a, b) => (/^y/i.test(b[4]) ? 1 : 0) - (/^y/i.test(a[4]) ? 1 : 0));
  return rows.map(r => r[2]);
};
const classSubjects = c => [...new Set(S.asg.filter(r => r[0] == c && !/^n/i.test(r[5])).map(r => r[1]))].sort(natural);

/* ---------- i18n (English UI + Arabic toggle with full RTL) ---------- */
const t = s => (HL == 'ar' && AR[s]) || s;
function applyLang() {
  document.documentElement.lang = HL; document.documentElement.dir = HL == 'ar' ? 'rtl' : 'ltr'; document.body.dir = HL == 'ar' ? 'rtl' : 'ltr';
  $('#langt').textContent = HL == 'ar' ? 'English' : 'العربية';
  $('#ttl').textContent = t('School Operations Platform'); $('#lgn').src = ((typeof S !== 'undefined' && S && S.set && S.set.brand && S.set.brand.logo) || LOGO.n); $('#lgv').src = LOGO.v;
}

/* ===================== 2. VIEWS: timetable grids (class, teacher, room, master) ===================== */
let TAB = 'tt', VIEW = 'class', SEL = { c: '', t: '', r: '', stage: '', day: 0 };

/* conflict message, built from the structured params the server returns (so it follows the UI language) */
function cmsg(c) {
  const p = c.p, d = p.d != null ? dayName(p.d) : '', tm = p.st != null ? hhmm(p.st) : '';
  switch (c.type) {
    case 1: return `${t('Teacher double-booked')}: ${tname(p.t)} · ${d} ${tm} · ${p.c1} (${p.sub1}) / ${p.c2} (${p.sub2})`;
    case 2: return `${tname(p.t)} ${p.kind == 'locked' ? t('has a locked time') : t('is unavailable')} · ${d} ${tm} · ${p.c}`;
    case 3: return p.scope == 'day' ? `${tname(p.t)}: ${p.n} ${t('periods on')} ${d} (${t('max')} ${p.max})` : `${tname(p.t)}: ${p.n} ${t('periods per week')} (${t('max')} ${p.max})`;
    case 4: return `${t('Class double-booked')}: ${p.c} · ${d} P${p.pd} · ${p.sub1} / ${p.sub2} (${t('add different group labels')})`;
    case 5: return `${tname(p.t)} ${t('is not assigned to')} ${p.c} / ${p.s}`;
    case 6: return `${t('Room double-booked')}: ${p.r} · ${d} ${tm} · ${p.c1} / ${p.c2}`;
    case 7: return `${t('Period does not exist for this class')}: ${p.c} · ${d} P${p.pd} · ${p.s}`;
    case 8: return `${p.c} · ${p.s}: ${p.have} ${t('lessons, required')} ${p.want}`;
  } return c.id;
}
const TYPES = { 1: 'Teacher double-booked', 2: 'Teacher unavailable / locked', 3: 'Over max load', 4: 'Class double-booked', 5: 'Teacher not assigned', 6: 'Room double-booked', 7: 'Period missing', 8: 'Weekly requirement' };

/* one lesson entry inside a cell. mode 'c' = class cell (teachers shown), 'o' = owner view (class shown) */
function enH(l, mode) {
  const cf = PRINT ? [] : (I.cf[l.id] || []), sev = cf.some(x => x.sev == 'error') ? 'e' : cf.length ? 'w' : '', col = subjCol(l.s);
  const badge = sev ? `<a class="cb ${sev}" data-cf="${esc(cf[0].id)}" title="${esc(cf.map(cmsg).join('\n'))}">!</a>` : '';
  const tch = PRINT && PP.noT && mode != 'o' ? '' : l.t.length ? l.t.map(id => `<i>${esc(short(tname(id)))}</i>`).join('') : `<i class="un">${t('Teacher unassigned')}</i>`;
  const body = mode == 'o' ? `<b>${esc(l.c)}</b><i>${subjIco(l.s)}${esc(l.s)}</i>` : `<b>${subjIco(l.s)}${esc(l.s)}</b>${tch}`;
  return `<div class="en ${sev == 'e' ? 'bad' : sev == 'w' ? 'wn' : ''}" ${PRINT ? '' : 'draggable="true"'} data-id="${l.id}" data-c="${l.c}" data-d="${l.d}" data-p="${l.p}" style="--sc:${col.c};--sb:${col.b}">${badge}${body}${l.g ? `<small>${esc(l.g)}</small>` : ''}${l.l ? `<small class="lk">${ic('lock')}</small>` : ''}</div>`;
}
function cellEntries(c, d, p) {
  const es = cellL(c, d, p), max = 3, show = PRINT ? es : es.slice(0, max);
  return show.map(l => enH(l, 'c')).join('') + (es.length > show.length ? `<span class="more">+${es.length - show.length}</span>` : '');
}
const hCell = z => `<th class="hd${z.x.brk ? ' brk' : ''}" colspan="${z.sp}"><b>${esc(z.x.label)}</b>${pt(z.x.s)}–${pt(z.x.e)}</th>`;
const dayTh = (d, g, rs) => `<th class="dy" rowspan="${rs}">${dayName(d)}<small>${dayDate(d)}</small>${isG12(g) ? `<small><b>${AB_B.includes(d) ? t('B Day') : t('A Day')}</b></small>` : ''}</th>`;
const abNote = g => isG12(g) ? `<div class="abn"><b>${t('A Days')}</b>: ${DAYS.filter((_, d) => I.days.includes(d) && !AB_B.includes(d)).map(t).join(', ')} &nbsp;|&nbsp; <b>${t('B Days')}</b>: ${AB_B.map(d => t(DAYS[d])).join(', ')}</div>` : '';
const colgroup = (lead, W) => '<colgroup>' + lead.map(c => `<col class="${c}">`).join('') + '<col>'.repeat(W) + '</colgroup>';

/* print only: two lessons right after each other (same subject, teachers and group) share ONE box. sig(z) = what makes two neighbouring slots "the same lesson" ('' = empty) */
function printMerge(sl, sig) {
  if (!PRINT) return sl;
  const out = [];
  sl.forEach(z => {
    const p = out[out.length - 1], g = z.x.brk ? '' : sig(z);
    if (p && g && p.g === g && !p.x.brk && !z.x.brk) { p.sp += z.sp; return }
    out.push({ ...z, g });
  });
  return out;
}
function classTab(c) {
  const g = stageOf(c), W = gW(g); let h = `<table class="tt">${colgroup(['cd'], W)}`;
  I.days.forEach(d => {
    const sl = slotsOf(g, d, W); if (!sl.length) return;
    h += `<tr class="h">${dayTh(d, g, 2)}${sl.map(hCell).join('')}</tr><tr class="ct">` +
      printMerge(sl, z => cellL(c, d, z.k).map(l => l.s + '|' + l.t.join(',') + '|' + (l.g || '')).sort().join(';')).map(z => z.x.brk ? `<td class="bk" colspan="${z.sp}">${t('BREAK')}</td>` : `<td class="${PRINT ? '' : 'sel'}" colspan="${z.sp}" data-c="${c}" data-d="${d}" data-p="${z.k}">${cellEntries(c, d, z.k)}</td>`).join('') + '</tr>';
  });
  return h + '</table>' + abNote(g);
}
/* teacher / room views: one header+content row pair per bell schedule the owner has lessons in, on each day */
function ownerTab(match) {
  const ls = S.lessons.filter(l => l.sl && !l.sl.brk && match(l)), gs = [...new Set(ls.map(l => stageOf(l.c)))].sort(natural);
  if (!gs.length) return `<div class="empty">${t('No lessons')}</div>`;
  const W = Math.max(...gs.map(gW)); let h = `<table class="tt">${colgroup(['cd', 'cl'], W)}`;
  I.days.forEach(d => {
    const here = gs.filter(g => ls.some(l => l.d == d && stageOf(l.c) == g)), use = here.length ? here : [gs[0]];
    use.forEach((g, i) => {
      const sl = slotsOf(g, d, W); if (!sl.length) return;
      h += `<tr class="h">${i == 0 ? dayTh(d, use.length == 1 && isG12(g) ? g : '', use.length * 2) : ''}<th class="lv" rowspan="2">${esc(g.replace(/^G(\d+)-G(\d+)$/, 'G$1–G$2'))}</th>${sl.map(hCell).join('')}</tr><tr class="ct">` +
        printMerge(sl, z => ls.filter(l => l.d == d && stageOf(l.c) == g && l.p == z.k).map(l => l.c + '|' + l.s + '|' + (l.g || '')).sort().join(';')).map(z => z.x.brk ? `<td class="bk" colspan="${z.sp}">${t('BREAK')}</td>` : `<td colspan="${z.sp}">${ls.filter(l => l.d == d && stageOf(l.c) == g && l.p == z.k).map(l => enH(l, 'o')).join('')}</td>`).join('') + '</tr>';
    });
  });
  return h + '</table>';
}
function masterTab(stage, d) {
  const cs = I.classes.filter(c => stageOf(c) == stage), W = gW(stage), sl = slotsOf(stage, d, W);
  if (!sl.length || !cs.length) return `<div class="empty">${t('No lessons')}</div>`;
  let h = `<table class="tt">${colgroup(['cl'], W)}<tr class="h"><th class="dy">${t('Class')}</th>${sl.map(hCell).join('')}</tr>`;
  cs.forEach((c, i) => {
    h += `<tr class="ct"><th class="dy">${c}</th>` + sl.map(z => z.x.brk ? (i == 0 ? `<td class="bk" colspan="${z.sp}" rowspan="${cs.length}">${t('BREAK')}</td>` : '') : `<td class="${PRINT ? '' : 'sel'}" colspan="${z.sp}" data-c="${c}" data-d="${d}" data-p="${z.k}">${cellEntries(c, d, z.k)}</td>`).join('') + '</tr>';
  });

/* ---------- import: parse the master workbook in the browser, send the result to the server ---------- */
const xs = v => v == null ? '' : String(v);
function xBuild(A) {
  const M = A['Master'] || [], gv = (r, c) => { const v = (M[r] || [])[c]; return v == null ? '' : v }, f24 = (h, i) => { h = +h; return String(h < 7 ? h + 12 : h).padStart(2, '0') + ':' + i };
  const hdrp = (r, d, k) => { const s = xs(gv(r, 1 + d * 10 + k)).trim(); if (!s) return null; const x = [...s.matchAll(/(\d{1,2}):(\d{2})/g)], brk = /break/i.test(s);
    let lab = s.replace(/(\d{1,2}):(\d{2})\s*[–-]?\s*(\d{1,2}:\d{2})?/g, '').replace(/Sunday|Monday|Teusday|Tuesday|Wednesday|Thursday/gi, '').replace(/break/gi, '').replace(/\s+/g, ' ').trim().replace(/^[\s\-–]+|[\s\-–]+$/g, '');
    if (brk) lab = 'Break'; if (x.length < 2) return null; return [lab, f24(x[0][1], x[0][2]), f24(x[1][1], x[1][2]), brk ? 'Y' : 'N'] };
  const sr = [], cls = [], tt = []; [['G1-G3', 1], ['G4-G10', 6], ['G11', 17], ['G12', 20]].forEach(([n, r]) => { for (let d = 0; d < 5; d++) for (let k = 0; k < 10; k++) { const q = hdrp(r, d, k); if (q) sr.push([n, String(d), String(k + 1)].concat(q)) } });
  const grp = n => { const g = parseInt(n.slice(1)); return g <= 3 ? 'G1-G3' : g == 11 ? 'G11' : g == 12 ? 'G12' : 'G4-G10' };
  for (let r = 2; r <= 24; r++) { const n = xs(gv(r, 0)).trim(); if (!/^G\d+[A-C]$/.test(n)) continue; cls.push([n, grp(n)]);
    for (let d = 0; d < 5; d++) for (let k = 0; k < 10; k++) { const v = xs(gv(r, 1 + d * 10 + k)); if (!v.trim()) continue; const L = v.split('\n').map(x => x.trim()).filter(Boolean); tt.push([n, String(d), String(k + 1), L[0], L.slice(1).join('\n')]) } }
  const CL = new Set(cls.map(x => x[0])), normc = v => { v = xs(v).trim().replace(/^Gr(\d+[A-C])$/, 'G$1'); return /^G(4|5|6|9)$/.test(v) ? v + 'A' : v }, rows = {}, names = {};
  const add = (c, s, code, name, prim, act, note) => { const k = c + '|' + s.toLowerCase() + '|' + code; if (!rows[k] || note != 'from Teacher Subject') rows[k] = [c, s, code, name, prim, act, note] };
  const ts = A['Teacher Subject'] || []; for (let r = 4; r < ts.length; r++) { const R = ts[r], code = xs(R[0]).trim(), s = xs(R[2]).trim(); if (!code || !s) continue; names[code] = xs(R[1]).trim(); for (let k = 3; k < 13; k++) { const v = xs(R[k]); if (v && CL.has(normc(v))) add(normc(v), s, code, names[code], '', 'Yes', 'from Teacher Subject') } }
  const ta = A['Teacher Assignments'] || []; for (let r = 1; r < ta.length; r++) { const R = ta[r], c = xs(R[0]).trim(), s = xs(R[1]).trim(), code = xs(R[2]).trim(); if (c && s && code) { add(c, s, code, xs(R[3]).trim(), xs(R[5]), xs(R[6]) || 'Yes', 'from Teacher Assignments'); if (!names[code]) names[code] = xs(R[3]).trim() } }
  tt.forEach(([c, d, k, subj, tch]) => tch.split('\n').forEach(line => { const m = line.match(/\((TU\d+)\)/); if (m && !rows[c + '|' + subj.toLowerCase() + '|' + m[1]]) add(c, subj, m[1], names[m[1]] || line.replace(/\s*\(TU\d+\)/, '').trim(), '', 'Yes', 'from timetable') }));
  const asg = Object.values(rows).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0);
  const AL = { 'french/german': 'MFL', 'religion/christian religion': 'Religion', 'religion religion': 'Religion', 'maths': 'Math', 'assimbly': 'Circle Time / Assembly', 'pe': 'P.E' }, subs = {}; tt.forEach(r => subs[r[3].toLowerCase()] = r[3]);
  const wr = A['Weekly Requirements'] || [], req = []; for (let r = 4; r < wr.length; r++) { const R = wr[r], m = xs(R[0]).trim().match(/^Grade\s*(\d+)$/); if (!m || !xs(R[1]).trim() || R[2] === '' || R[2] == null || +m[1] > 10) continue; let s = xs(R[1]).trim(); s = AL[s.toLowerCase()] || s; if (s.toLowerCase() == 'english/sat') continue; s = subs[s.toLowerCase()] || s; req.push(['G' + m[1], s, String(parseInt(R[2]))]) }
  return { sr, cls, tt, asg, req, names };
}
function xRead(f) {
  if (typeof XLSX == 'undefined') return toast(t('The Excel reader could not be loaded. Check the internet connection.'), 1);
  $('#xm').textContent = t('Reading the file...');
  f.arrayBuffer().then(buf => {
    const wb = XLSX.read(buf, { type: 'array', sheets: ['Master', 'Teacher Subject', 'Teacher Assignments', 'Weekly Requirements'] }), A = {};
    ['Master', 'Teacher Subject', 'Teacher Assignments', 'Weekly Requirements'].forEach(n => A[n] = wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true }) : []);
    const X = xBuild(A); if (!X.cls.length) { $('#xm').textContent = ''; return toast(t('No classes were found in the Master sheet of this file.'), 1) }
    XI = { X, name: f.name, d: { lessons: X.tt.length, slots: X.sr.length, classes: X.cls.length, asg: X.asg.length, req: X.req.length }, sel: { lessons: true, slots: true, classes: true, asg: true, req: true } }; render();
  }).catch(e => { $('#xm').textContent = ''; toast(t('Could not read the file: ') + e.message, 1) });
}
const dl = (name, blob) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000) };
function exportXlsx() {

}

const NEWROW = { Schedules: () => [SF, '0', '', '', '', '', 'N'], Classes: () => ['', ''], Subjects: () => ['', '#888888', '', '', '', '', '', '', ''], Teachers: () => ['', '', '', '', '', ''], Blocked: () => ['', '0', '', '', '', 'unavailable'], Assignments: () => [AF, '', '', '', '', 'Yes', 'added in app'], WeeklyReq: () => ['', '', ''], Shared: () => ['', '', '0', '', '', ''], Rooms: () => ['', ''], Access: () => [''] };
const TABS = [['tt', 'Timetables', 'grid'], ['cf', 'Conflicts', 'alert'], ['rp', 'Reports & Print', 'print'], ['st', 'Settings', 'gear']];
function render() {
  const k = S.conflicts.counts;
  $('#cc').innerHTML = `${ic('alert')} ${t('Conflicts')} <b class="e">${k.error}</b><b class="w">${k.warning}</b>`;
  $('#sub').textContent = `${S.set.year} · ${t('Week')}: ${weekTxt()}`;
  $('#tabs').innerHTML = TABS.map(([id, l, i]) => `<button class="pill${id == TAB ? ' on' : ''}" data-tab="${id}">${ic(i)} ${t(l)}${id == 'cf' && k.error + k.warning ? ` <span class="tag ${k.error ? 'e' : 'w'}">${k.error + k.warning}</span>` : ''}</button>`).join('');
  const sy = window.scrollY;
  $('#v').innerHTML = { tt: rTimetables, cf: rConflicts, rp: rReports, st: rSettings }[TAB]();
  window.scrollTo(0, sy);
}
async function act(el) {
  const a = el.dataset.a, n = el.dataset.n;
  if (a == 'rowadd') { ed(n).push(NEWROW[n]()); render() }
  else if (a == 'rowdel') { ed(n).splice(+el.dataset.r, 1); render() }
  else if (a == 'tsave') await saveTbl(n);
  else if (a == 'gsave') await saveGeneral();
  else if (a == 'cfclr') { CF.focus = ''; render() }
  else if (a == 'gocell') goCell(el.dataset.c, +el.dataset.d, +el.dataset.p);
  else if (a == 'gocls') { TAB = 'tt'; VIEW = 'class'; SEL.c = el.dataset.c; render() }
  else if (a == 'share') { S = await srv('api_approveShared', el.dataset.id); index(); toast(t('Approved as shared')); render() }
  else if (a == 'ign') { S = await srv('api_ignore', el.dataset.id, el.dataset.on == '1'); index(); render() }
  else if (a == 'doprint') doPrint();
  else if (a == 'xlsx') exportXlsx();
  else if (a == 'bkp') dl('VIA_backup.json', new Blob([JSON.stringify(await srv('api_backup'), null, 1)], { type: 'application/json' }));
  else if (a == 'log') { LOGR = await srv('api_log'); render() }
  else if (a == 'splitmfl') { if (!confirm(t('Split every MFL lesson into French and German entries?'))) return; S = await srv('api_splitMfl'); toast(S.splitCount + ' ' + t('lessons split')); index(); render() }
  else if (a == 'ximp') {
    const parts = { ...XI.sel }, X = XI.X; S = await srv('api_import', { sr: X.sr, cls: X.cls, tt: X.tt, asg: X.asg, req: X.req, names: X.names, parts }); XI = null; ED = {}; index(); toast(t('Imported')); render();
  }
}
document.addEventListener('click', e => {
  const T = e.target;
  if (T.closest('#dr')) { const b = T.closest('[data-a]'); if (b) drawerAct(b); return }
  let el;
  if ((el = T.closest('.cb[data-cf],.tag[data-cf]'))) return goConflicts(el.dataset.cf);
  if ((el = T.closest('[data-tab]'))) { TAB = el.dataset.tab; if (TAB == 'cf') CF.focus = ''; return render() }
  if ((el = T.closest('[data-view]'))) { VIEW = el.dataset.view; return render() }
  if ((el = T.closest('[data-sel-day]'))) { SEL.day = +el.dataset.selDay; return render() }
  if ((el = T.closest('[data-sub]'))) { SUB = el.dataset.sub; if (SUB == 'academic' || SUB == 'brand') SUB = 'general'; return render() }
  if ((el = T.closest('[data-pk]'))) { PP.k = el.dataset.pk; return render() }
  if ((el = T.closest('[data-csev]'))) { CF = { ...CF, sev: el.dataset.csev, type: '', focus: '' }; return render() }
  if ((el = T.closest('[data-ctype]'))) { CF = { ...CF, type: el.dataset.ctype, sev: '', focus: '' }; return render() }
  if ((el = T.closest('[data-a]'))) return act(el);
  if ((el = T.closest('td[data-c]'))) return openCell(el.dataset.c, +el.dataset.d, +el.dataset.p);
  if ((el = T.closest('.en[data-c]')) && TAB == 'tt') return openCell(el.dataset.c, +el.dataset.d, +el.dataset.p);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('#dr')) { if (el.dataset.f && drawerField(el)) drawDr(); return }
  const D = el.dataset;
  if (D.sel) { SEL[D.sel] = el.value; return render() }
  if ('sf' in D) { SF = el.value; return render() }
  if ('af' in D) { AF = el.value; return render() }
  if (D.cfs) { CF[D.cfs] = el.value; CF.focus = ''; return render() }
  if ('cfi' in D) { CF.ign = el.checked; return render() }
  if ('pnt' in D) { PP.noT = el.checked; return }
  if (D.ppx) { const sl = ppSel(D.ppk); el.checked ? sl.add(D.ppx) : sl.delete(D.ppx); return ppRefresh() }
  if ('ppst' in D) { PP.stage = el.value; return }
  if (D.xk) { XI.sel[D.xk] = el.checked; return }
  if (el.id == 'xf' && el.files[0]) return xRead(el.files[0]);
  if (D.e) { const [n, r, c] = D.e.split('|'); ed(n)[+r][+c] = el.value }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('#dr')) { if (el.dataset.f == 'g') drawerField(el); return }
  if (el.dataset.e) { const [n, r, c] = el.dataset.e.split('|'); ed(n)[+r][+c] = el.value }
});
/* drag & drop between cells (class view and master grid) */
let DRAG = '';
document.addEventListener('dragstart', e => { const en = e.target.closest && e.target.closest('.en[data-id]'); if (!en) return; DRAG = en.dataset.id; e.dataTransfer.setData('text/plain', DRAG); e.dataTransfer.effectAllowed = 'move' });
document.addEventListener('dragover', e => { const td = e.target.closest && e.target.closest('td.sel[data-c]'); if (td && DRAG) { e.preventDefault(); $$('.over').forEach(x => x.classList.remove('over')); td.classList.add('over') } });
document.addEventListener('drop', async e => {
  const td = e.target.closest && e.target.closest('td.sel[data-c]'); if (!td || !DRAG) return; e.preventDefault();
  const id = DRAG; DRAG = ''; $$('.over').forEach(x => x.classList.remove('over'));
  const l = I.byId[id]; if (!l || (l.c == td.dataset.c && l.d == td.dataset.d && l.p == td.dataset.p)) return;
  try { if (await mvGuard('api_moveEntry', [id, td.dataset.c, +td.dataset.d, +td.dataset.p]) != 'go') return render(); const r = await srv('api_moveEntry', id, td.dataset.c, +td.dataset.d, +td.dataset.p); S.lessons = r.lessons; S.conflicts = r.conflicts; index(); toast(t('Moved')); render() } catch (x) { render() }
});
document.addEventListener('dragend', () => { DRAG = ''; $$('.over').forEach(x => x.classList.remove('over')) });
$('#cc').onclick = () => goConflicts('');
$('#lang').onclick = () => { HL = HL == 'ar' ? 'en' : 'ar'; try { localStorage.setItem('hl', HL) } catch (e) { } applyLang(); render(); if (DR) drawDr() };
function init() {
  applyLang(); $('#v').innerHTML = `<p class="msg">${t('Loading...')}</p>`;
  srv('api_boot').then(b => { S = b; index(); render() }).catch(e => { $('#v').innerHTML = `<div class="empty">${esc(String((e && e.message) || e))}</div>` });
}
init();

<script>
"use strict";
/* Needs Scripts.html to be included BEFORE this file. Adds the "Master sheet" tab. */
Object.assign(AR, {
  'Master sheet': 'الشيت الماستر',
  'Show all classes': 'عرض كل الفصول',
  'Teacher free · empty cell': 'المدرس فاضي · خانة فارغة',
  'Drag a lesson: green cells show where its teacher is free.': 'اسحب الحصة: الخانات الخضراء هي أوقات فراغ المدرس.',
  'Swap possible (both teachers free)': 'تبديل ممكن (المدرسين فاضيين)',
  'Swap whole cell': 'تبديل الخانة كلها',
  'Auto swap': 'تبديل تلقائي',
  'Auto swap off: dropping on a busy cell just moves the lesson there.': 'التبديل التلقائي متوقف: الإسقاط على خانة مشغولة ينقل الحصة فقط.',
  'Swap one lesson': 'تبديل حصة واحدة',
  'Swap with which lesson?': 'تبدل مع أنهي حصة؟',
  'Swapped': 'تم التبديل',
  'Highlight teacher': 'تمييز مدرس',
  'Clash cells': 'خانات التعارض',
  'Unassigned': 'بدون مدرس',
  'Weekly matched': 'المتطلبات المطابقة',
  'Zoom': 'تكبير',
  'Clash': 'تعارض',
  'Parallel lessons': 'حصص متوازية'
});
TABS.splice(1, 0, ['bm', 'Master sheet', 'grid']);
const BM = { all: false, auto: true, whole: false, tch: '', un: false, zoom: 80 };
try { BM.auto = localStorage.getItem('bma') !== '0'; BM.whole = localStorage.getItem('bmw') === '1'; BM.zoom = +localStorage.getItem('bmz') || 80 } catch (e) { }

/* ---------- free-time logic ---------- */
function tFree(tid, c, d, p, ign) {          // is teacher tid free at class c / day d / period p? (lessons in `ign` are ignored)
  const sl = slotOf(c, d, p);
  if (!sl || sl.brk) return false;
  if ((I.byT[tid + '|' + d] || []).some(x => !(ign && ign.has(x.id)) && x.sl.s < sl.e && x.sl.e > sl.s)) return false;
  return !S.blocked.some(b => b[0] == tid && +b[1] == d && toMin(b[2]) < sl.e && toMin(b[3]) > sl.s);
}
function teacherFree(l, c, d, p, ign) {      // all teachers of lesson l free there? (the lesson itself is ignored)
  const g = new Set(ign || []); g.add(l.id);
  const sl = slotOf(c, d, p); if (!sl || sl.brk) return false;
  return l.t.every(tid => tFree(tid, c, d, p, g));
}
function clearMarks() { $$('#bmsc td.ok,#bmsc td.mid,#bmsc td.dim').forEach(x => x.classList.remove('ok', 'mid', 'dim')) }
/* while dragging: green = moves there, amber = swap possible both ways, faded = not possible */
function markFree(id) {
  const l = I.byId[id]; if (!l || l.l) return;
  const A = BM.whole ? cellL(l.c, l.d, l.p) : [l];
  if (A.some(x => x.l)) return $$('#bmsc td.sel').forEach(td => td.classList.add('dim'));
  const mine = new Set([l.c]);
  S.asg.forEach(r => { if (!/^n/i.test(r[5]) && A.some(x => lc(r[1]) == lc(x.s) && x.t.includes(r[2]))) mine.add(r[0]) });
  $$('#bmsc td.sel').forEach(td => {
    const c = td.dataset.c, d = +td.dataset.d, p = +td.dataset.p;
    if (c == l.c && d == l.d && p == l.p) return;
    const here = cellL(c, d, p);
    if ((!BM.all && !mine.has(c)) || here.some(x => x.l)) return td.classList.add('dim');
    if (!here.length || !BM.auto) {
      const ign = new Set(A.map(x => x.id));
      return td.classList.add(A.every(x => teacherFree(x, c, d, p, ign)) ? 'ok' : 'dim');
    }
    const cands = BM.whole ? [here] : here.map(x => [x]);
    const good = cands.some(B => {
      const ign = new Set(A.concat(B).map(x => x.id));
      return A.every(x => teacherFree(x, c, d, p, ign)) && B.every(x => teacherFree(x, l.c, l.d, l.p, ign));
    });
    td.classList.add(good ? 'mid' : 'dim');
  });
}

/* ---------- the sheet ---------- */
function bmStats() {
  const cl = new Set(); S.lessons.forEach(l => { if ((I.cf[l.id] || []).some(x => x.sev == 'error')) cl.add(l.c + '|' + l.d + '|' + l.p) });
  const un = S.lessons.filter(l => !l.t.length).length;
  let tot = 0; I.classes.forEach(c => { const n = parseInt(c.slice(1), 10), pre = n > 10 ? c : 'G' + n; S.req.forEach(r => { if (r[0] == pre) tot++ }) });
  const mis = S.conflicts.list.filter(x => x.type == 8).length;
  return { cl: cl.size, un, ok: Math.max(0, tot - mis), tot };
}
function bmCls(c, d, p) {
  const es = cellL(c, d, p);
  return (es.some(l => (I.cf[l.id] || []).some(x => x.sev == 'error')) ? ' clash' : es.length > 1 ? ' multi' : '');
}
/* one day of one stage band: kind 'h' = slot headers, 'c' = the cells of class c. Pads to Wm columns so stages with fewer slots line up. */
function bmDay(g, d, di, Wg, Wm, kind, c) {
  const sl = slotsOf(g, d, Wg), tg = kind == 'h' ? 'th' : 'td', dt = ' dt' + (di % 5);
  let s = '';
  if (!sl.length) s = `<${tg} class="${dt}" colspan="${Wm}"></${tg}>`;
  else {
    if (sl[0].k > 1) s += `<${tg} class="${dt}" colspan="${sl[0].k - 1}"></${tg}>`;
    sl.forEach(z => {
      s += kind == 'h' ? hCell(z) : z.x.brk ? `<td class="bk${dt}" colspan="${z.sp}">${t('BREAK')}</td>`
        : `<td class="sel${bmCls(c, d, z.k)}${dt}" colspan="${z.sp}" data-c="${c}" data-d="${d}" data-p="${z.k}">${cellL(c, d, z.k).map(l => enH(l, 'c')).join('')}</td>`;
    });
    if (Wm > Wg) s += `<${tg} class="${dt}" colspan="${Wm - Wg}"></${tg}>`;
  }
  return s.replace('class="', 'class="dv ');
}
function rBigMaster() {
  const st = stages(); if (!SEL.bm || (SEL.bm != '*' && !st.includes(SEL.bm))) SEL.bm = '*';
  const show = SEL.bm == '*' ? st : [SEL.bm], days = I.days, Wm = Math.max(1, ...show.map(gW)), k = bmStats();
  const tl = teachersWithLessons();
  const bar = `<div class="bar"><select data-bms><option value="*"${SEL.bm == '*' ? ' selected' : ''}>${t('All stages')}</option>${opts(st.map(x => [x, x]), SEL.bm)}</select>
<select data-bmt><option value="">${t('Highlight teacher')}</option>${opts(tl.map(x => [x, tname(x)]), BM.tch)}</select>
<div class="seg"><button data-bmw="0" class="${BM.whole ? '' : 'on'}">${t('Swap one lesson')}</button><button data-bmw="1" class="${BM.whole ? 'on' : ''}">${t('Swap whole cell')}</button></div>
<label title="${esc(t('Auto swap off: dropping on a busy cell just moves the lesson there.'))}"><input type="checkbox" data-bma${BM.auto ? ' checked' : ''}> ${t('Auto swap')}</label>
<label><input type="checkbox" data-bmall${BM.all ? ' checked' : ''}> ${t('Show all classes')}</label>
<label>${t('Zoom')} <input type="range" min="30" max="120" step="5" value="${BM.zoom}" data-bmz style="vertical-align:middle;width:110px"> <span id="bmzv">${BM.zoom}%</span></label></div>
<div class="bar" style="position:static">
<button class="b bmk" data-bmk="cl"><b>${k.cl}</b> ${t('Clash cells')}</button><button class="b bmk" data-bmk="un"${BM.un ? ' style="background:var(--hl)"' : ''}><b>${k.un}</b> ${t('Unassigned')}</button><button class="b bmk" data-bmk="wk"><b>${k.ok}/${k.tot}</b> ${t('Weekly matched')}</button>
<span class="lg"><i class="ok"></i>${t('Teacher free · empty cell')}</span><span class="lg"><i class="mid"></i>${t('Swap possible (both teachers free)')}</span><span class="lg"><i class="multi"></i>${t('Parallel lessons')}</span><span class="lg"><i class="clash"></i>${t('Clash')}</span></div>`;
  if (!show.length || !days.length) return bar + `<div class="empty">${t('No lessons')}</div>`;
  const CW = 100, CL = 84;
  let h = `<div class="sc card bmw" id="bmsc" style="padding:0"><table class="tt bm" style="zoom:${BM.zoom / 100};width:${CL + days.length * Wm * CW}px"><colgroup><col style="width:${CL}px">${('<col style="width:' + CW + 'px">').repeat(days.length * Wm)}</colgroup>`;
  h += `<tr class="h r1"><th class="dy bmc">${t('Class')}</th>${days.map(d => `<th class="dy dv" colspan="${Wm}">${dayName(d)}<small>${dayDate(d)}</small></th>`).join('')}</tr>`;
  show.forEach(g => {
    const Wg = gW(g), cs = I.classes.filter(c => stageOf(c) == g);
    h += `<tr class="h band"><th class="bmc lv">${esc(g.replace(/^G(\d+)-G(\d+)$/, 'G$1–G$2'))}</th>${days.map((d, di) => bmDay(g, d, di, Wg, Wm, 'h')).join('')}</tr>`;
    cs.forEach(c => { h += `<tr class="ct"><th class="dy bmc">${c}</th>${days.map((d, di) => bmDay(g, d, di, Wg, Wm, 'c', c)).join('')}</tr>` });
  });
  return bar + h + '</table></div>' + (show.includes('G12') ? abNote('G12') : '');
}
/* teacher highlight + unassigned highlight (after the grid is in the page) */
function bmAfter() {
  if (BM.un) $$('#bmsc .en[data-id]').forEach(e => { const l = I.byId[e.dataset.id]; if (l && !l.t.length) e.classList.add('hl') });
  const tid = BM.tch; if (!tid) return;
  const cls = new Set(S.asg.filter(r => r[2] == tid && !/^n/i.test(r[5])).map(r => r[0]));
  $$('#bmsc td.sel').forEach(td => {
    const c = td.dataset.c, d = +td.dataset.d, p = +td.dataset.p, es = cellL(c, d, p);
    if (es.some(l => l.t.includes(tid))) {
      td.classList.add('tm');
      td.querySelectorAll('.en[data-id]').forEach(e => { if (I.byId[e.dataset.id].t.includes(tid)) e.classList.add('hl') });
    } else if (!es.length && cls.has(c) && tFree(tid, c, d, p, new Set())) td.classList.add('tf');
  });
}

/* hook into render(): the original draws header/tabs, then we swap in our view and keep the scroll position */
const _render = render;
render = function () {
  const bo = $('#bmsc'), pos = bo ? [bo.scrollLeft, bo.scrollTop] : null, sy = window.scrollY;
  if (TAB !== 'bm') return _render();
  TAB = 'tt'; try { _render() } finally { TAB = 'bm' }
  $$('#tabs .pill').forEach(b => b.classList.toggle('on', b.dataset.tab === 'bm'));
  $('#v').innerHTML = rBigMaster();
  bmAfter();
  const nb = $('#bmsc'); if (nb && pos) { nb.scrollLeft = pos[0]; nb.scrollTop = pos[1] }
  window.scrollTo(0, sy);
};

/* ---------- events ---------- */
document.addEventListener('dragstart', e => {
  const en = TAB === 'bm' && e.target.closest && e.target.closest('.en[data-id]');
  if (en) { const id = en.dataset.id; setTimeout(() => markFree(id), 0) }
});
document.addEventListener('dragend', clearMarks);
document.addEventListener('click', e => {
  const w = e.target.closest && e.target.closest('[data-bmw]');
  if (w) { BM.whole = w.dataset.bmw === '1'; try { localStorage.setItem('bmw', BM.whole ? '1' : '0') } catch (x) { } return render() }
  const b = e.target.closest && e.target.closest('[data-bmk]');

});
document.addEventListener('input', e => {
  if (!('bmz' in e.target.dataset)) return;

document.addEventListener('change', e => {
  const D = e.target.dataset;
  if ('bms' in D) { SEL.bm = e.target.value; render() }
  else if ('bmt' in D) { BM.tch = e.target.value; render() }

  else if ('bma' in D) { BM.auto = e.target.checked; try { localStorage.setItem('bma', BM.auto ? '1' : '0') } catch (x) { } render() }
});
function pickLesson(list) {                 // small chooser when a cell has several lessons and none was targeted

<script>

});

}
const nEvK = { request: 'requested an absence', approved: 'absence approved', rejected: 'absence rejected', cancelled: 'absence cancelled', cover: 'substitute lesson', uncover: 'substitute lesson removed' };

    n.ch.slice(0, 4).map(nLine).join('') + (n.ch.length > 4 || n.more ? '<div class="l">+' + (n.ch.length - 4 + n.more) + ' ' + t('more') + '</div>' : '') + '</div>').join('') : '<div class="em">' + t('No notifications yet') + '</div>';

}
function nSnack0(msg) { const s = $('#nsn'); if (!s) return; s.innerHTML = '<span>' + esc(msg) + '</span><button class="x" data-nf="snackx" aria-label="close">×</button>'; s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 3000) }

/* ---- push subscription ---- */
const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = (s + p).replace(/-/g, '+').replace(/_/g, '/'), r = atob(b); return Uint8Array.from([...r].map(c => c.charCodeAt(0))) };

  const nb = e.target.closest && e.target.closest('#nb');

    const k = a.dataset.nf;

    else if (k == 'close') nToggle(false);

    else if (k == 'on') { await nSub(true); nPanel() }
    else if (k == 'off') { await nUnsub(); nPanel() }

function nStart() {
  if (NF.timer || typeof S === 'undefined' || !S || !S.role || S.register) return;

  seg.insertAdjacentHTML('beforebegin', '<button id="nb" title="' + esc(t('Notifications')) + '"><svg class="ic" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="n"></span></button>');
  document.body.insertAdjacentHTML('beforeend', '<div id="np"></div><div id="nsn"></div><button id="nsv" data-nf="save"></button>');
  NF.timer = setInterval(nPoll, 90000);

</script>

<script>
"use strict";
/* Auto distribution of lessons (Settings > Auto schedule). Needs Scripts.html + Ux.html. Two steps: preview (nothing is saved), then Apply (Undo is offered). */
Object.assign(AR, {
  'Auto schedule': 'التوزيع التلقائي', 'Auto distribution of lessons': 'التوزيع التلقائي للحصص',
  'Builds the timetable from the data you already entered: weekly requirements, assignments, teachers unavailable times and limits, schedules and locked lessons. Nothing is saved until you press Apply, and Undo brings the old timetable back.': 'يبني الجدول من البيانات المدخلة بالفعل: المتطلبات الأسبوعية، التكليفات، أوقات المدرسين غير المتاحة وحدودهم، التوقيتات، والحصص المقفولة. لا يُحفظ شيء قبل الضغط على تطبيق، ويمكنك التراجع بـ Undo.',
  'Fill the empty places only': 'ملء الأماكن الفارغة فقط', 'Keeps every lesson that exists and adds only what is missing.': 'يُبقي كل الحصص الموجودة ويضيف الناقص فقط.',
  'Rebuild from scratch': 'بناء من الصفر', 'Removes the lessons of the chosen classes (locked lessons stay) and distributes everything again.': 'يحذف حصص الفصول المختارة (المقفولة تبقى) ويوزع كل شيء من جديد.',
  'Prefer the old positions': 'تفضيل الأماكن القديمة', 'Classes': 'الفصول', 'Select all': 'اختيار الكل', 'Select none': 'إلغاء الكل', 'Preview': 'معاينة', 'Apply': 'تطبيق', 'Discard': 'تجاهل',
  'Planning...': 'جارٍ التوزيع...', 'Rules broken': 'قواعد مكسورة', 'Some subject rules could not be kept for every lesson. The rest of the rules are kept.': 'تعذر الالتزام بقواعد بعض المواد في كل الحصص.', 'Choose at least one class.': 'اختر فصلاً واحداً على الأقل.',
  'To place': 'مطلوب توزيعه', 'Placed': 'تم توزيعه', 'Not placed': 'لم يتوزع', 'Will be removed': 'سيُحذف', 'Needed per week': 'المطلوب أسبوعياً', 'Kept': 'موجود', 'New': 'جديد',
  'No free period left in the class': 'لا توجد حصة فارغة في الفصل', 'The teacher has no free time': 'المدرس ليس لديه وقت فارغ', 'The teacher reached the maximum load': 'المدرس وصل للحد الأقصى',
  'Skipped (needs groups, do it by hand)': 'تم تخطيها (تحتاج مجموعات، افعلها يدوياً)', 'No teacher assigned, placed without a teacher': 'بلا مدرس معيّن، وُزعت بدون مدرس',
  'Click a class to see its timetable. New lessons are green.': 'اضغط على فصل لرؤية جدوله. الحصص الجديدة باللون الأخضر.',
  'Apply the auto distribution?': 'تطبيق التوزيع التلقائي؟', 'Auto-distributed': 'تم التوزيع التلقائي', 'lessons will be added': 'حصة ستضاف', 'lessons will be removed first': 'حصة ستحذف أولاً', 'Lessons not placed stay as warnings in Conflicts.': 'الحصص التي لم تتوزع تظهر كتحذيرات في التعارضات.',
  'Nothing to add: every class already has its weekly lessons.': 'لا يوجد ما يضاف: كل فصل لديه حصصه الأسبوعية.', 'Break': 'استراحة', 'lessons': 'حصة', 'seconds': 'ثانية'
});
const AU = { mode: 'fill', sel: null, prefer: true, plan: null, view: '' };
const auNat = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
const auGrade = c => 'G' + (parseInt(String(c).slice(1), 10) || 0);
function auClasses() { return S.cls.map(r => r[0]).sort(auNat) }
function auSel() { if (!AU.sel) AU.sel = new Set(auClasses()); return AU.sel }
const AU_WHY = { 'class-full': 'No free period left in the class', 'teacher-busy': 'The teacher has no free time', 'teacher-limit': 'The teacher reached the maximum load' };

function sAuto() {
  const cl = auClasses(), sel = auSel(), grades = [...new Set(cl.map(auGrade))].sort(auNat);
  const chips = grades.map(g => '<div class="grp"><b>' + esc(g) + '</b> <button class="b" type="button" data-au="grade" data-g="' + g + '">' + t('Select all') + ' / ' + t('Select none') + '</button><br>' +
    cl.filter(c => auGrade(c) == g).map(c => '<label class="chip' + (sel.has(c) ? ' on' : '') + '"><input type="checkbox" data-au="cls" data-c="' + esc(c) + '"' + (sel.has(c) ? ' checked' : '') + '>' + esc(c) + '</label>').join('') + '</div>').join('');
  const m = (v, h, d) => '<label class="' + (AU.mode == v ? 'on' : '') + '"><input type="radio" name="aum" data-au="mode" value="' + v + '"' + (AU.mode == v ? ' checked' : '') + '> <b>' + t(h) + '</b><small>' + t(d) + '</small></label>';
  return '<div class="card au"><h3>' + t('Auto distribution of lessons') + '</h3><p class="msg">' + t('Builds the timetable from the data you already entered: weekly requirements, assignments, teachers unavailable times and limits, schedules and locked lessons. Nothing is saved until you press Apply, and Undo brings the old timetable back.') + '</p>' +
    '<div class="mode">' + m('fill', 'Fill the empty places only', 'Keeps every lesson that exists and adds only what is missing.') + m('rebuild', 'Rebuild from scratch', 'Removes the lessons of the chosen classes (locked lessons stay) and distributes everything again.') + '</div>' +
    (AU.mode == 'rebuild' ? '<p><label><input type="checkbox" data-au="prefer"' + (AU.prefer ? ' checked' : '') + '> ' + t('Prefer the old positions') + '</label></p>' : '') +
    '<h4>' + t('Classes') + ' <button class="b" type="button" data-au="all">' + t('Select all') + '</button> <button class="b" type="button" data-au="none">' + t('Select none') + '</button></h4>' + chips +
    '<div class="act"><button class="b pri" type="button" data-au="plan">' + t('Preview') + '</button></div></div>' + auResult();
}

function auGridRows() {                                  // lessons as they would be after Apply
  const p = AU.plan, rm = new Set(p.remove), out = S.lessons.filter(l => !rm.has(l.id)).map(l => ({ c: l.c, d: l.d, p: l.p, s: l.s, t: l.t || [], n: 0 }));
  p.add.forEach(r => out.push({ c: r[1], d: +r[2], p: +r[3], s: r[4], t: r[5] ? String(r[5]).split(',') : [], n: 1 }));
  return out;
}
function auGrid(c) {
  const sch = (S.cls.find(r => r[0] == c) || [])[1], rows = S.sch.filter(r => r[0] == sch), days = (S.set.days || [0, 1, 2, 3, 4]).map(Number).filter(d => rows.some(r => +r[1] == d));
  const slots = [...new Set(rows.map(r => +r[2]))].sort((a, b) => a - b), L = auGridRows().filter(x => x.c == c);
  const sl = (d, p) => rows.find(r => +r[1] == d && +r[2] == p);
  return '<div class="gw"><table class="gr"><tr><th></th>' + days.map(d => '<th>' + esc(dayName(d)) + '</th>').join('') + '</tr>' + slots.map(p => {
    const first = rows.find(r => +r[2] == p);
    return '<tr><th>' + esc(first ? first[3] : p) + '<small>' + esc(first ? first[4] + '-' + first[5] : '') + '</small></th>' + days.map(d => {
      const s = sl(d, p); if (!s) return '<td></td>';
      if (/^y/i.test(s[6])) return '<td class="brk">' + t('Break') + '</td>';
      const es = L.filter(x => x.d == d && x.p == p);
      return '<td class="' + (es.some(x => x.n) ? 'new' : '') + '">' + es.map(x => esc(x.s) + '<small>' + esc(x.t.map(z => tname(z)).join(', ')) + '</small>').join('<hr>') + '</td>';
    }).join('') + '</tr>';
  }).join('') + '</table></div>';
}
function auResult() {
  const p = AU.plan; if (!p) return '';
  const st = p.stats, rep = p.report, view = AU.view && rep.some(r => r.c == AU.view) ? AU.view : (rep.find(r => r.unplaced.length) || rep[0] || {}).c;
  AU.view = view;
  let h = '<div class="card au"><div class="sum"><div><b>' + st.placed + '</b>' + t('Placed') + '</div><div class="' + (st.unplaced ? 'bad' : '') + '"><b>' + st.unplaced + '</b>' + t('Not placed') + '</div>' +
    (st.rulesBroken ? '<div class="bad"><b>' + st.rulesBroken + '</b>' + t('Rules broken') + '</div>' : '') + (st.removed ? '<div><b>' + st.removed + '</b>' + t('Will be removed') + '</div>' : '') + '<div><b>' + st.classes + '</b>' + t('Classes') + '</div></div>';
  if (!st.placed && !st.removed && !st.unplaced) h += '<p class="msg">' + t('Nothing to add: every class already has its weekly lessons.') + '</p>';
  if (p.skipped.length) h += '<div class="note">' + t('Skipped (needs groups, do it by hand)') + ': ' + p.skipped.map(x => esc(x.c + ' ' + x.s + ' ×' + x.n)).join(' · ') + '</div>';
  if (p.noTeacher.length) h += '<div class="note">' + t('No teacher assigned, placed without a teacher') + ': ' + p.noTeacher.map(x => esc(x.c + ' ' + x.s)).join(' · ') + '</div>';
  h += '<table class="rs"><tr><th>' + t('Class') + '</th><th>' + t('Needed per week') + '</th><th>' + t('Kept') + '</th><th>' + t('New') + '</th><th>' + t('Not placed') + '</th></tr>' +
    rep.map(r => '<tr data-auc="' + esc(r.c) + '" class="' + (r.c == view ? 'on' : '') + '"><td><b>' + esc(r.c) + '</b></td><td>' + r.want + (r.want > r.capacity ? ' ⚠' : '') + '</td><td>' + r.kept + '</td><td>' + r.add + '</td><td>' +
      (r.unplaced.length ? r.unplaced.map(u => '<div class="why">' + esc(u.s) + ' ×' + u.n + ' - ' + t(AU_WHY[u.why] || '') + '</div>').join('') : '✓') + '</td></tr>').join('') + '</table>';
  if (view) h += '<p class="msg">' + t('Click a class to see its timetable. New lessons are green.') + ' <b>' + esc(view) + '</b></p>' + auGrid(view);
  h += '<div class="act"><button class="b pri" type="button" data-au="apply"' + (p.add.length || p.remove.length ? '' : ' disabled') + '>' + t('Apply') + '</button><button class="b" type="button" data-au="discard">' + t('Discard') + '</button></div></div>';
  return h;
}

document.addEventListener('change', e => {
  const a = e.target.closest && e.target.closest('[data-au]'); if (!a) return;
  const k = a.dataset.au;
  if (k == 'cls') { a.checked ? auSel().add(a.dataset.c) : auSel().delete(a.dataset.c); AU.plan = null; render() }
  else if (k == 'mode') { AU.mode = a.value; AU.plan = null; render() }
  else if (k == 'prefer') { AU.prefer = a.checked; AU.plan = null }
});
document.addEventListener('click', async e => {
  const row = e.target.closest && e.target.closest('[data-auc]');
  if (row && AU.plan) { AU.view = row.dataset.auc; return render() }
  const a = e.target.closest && e.target.closest('[data-au]'); if (!a || a.matches('input')) return;
  const k = a.dataset.au, sel = auSel();
  if (k == 'all') { auClasses().forEach(c => sel.add(c)); AU.plan = null; return render() }
  if (k == 'none') { sel.clear(); AU.plan = null; return render() }
  if (k == 'grade') { const cs = auClasses().filter(c => auGrade(c) == a.dataset.g), on = cs.every(c => sel.has(c)); cs.forEach(c => on ? sel.delete(c) : sel.add(c)); AU.plan = null; return render() }
  if (k == 'discard') { AU.plan = null; return render() }
  if (k == 'plan') {
    if (!sel.size) return toast(t('Choose at least one class.'), 1);
    UX.label = t('Planning...');
    try { AU.plan = await _uxSrv('api_autoPlan', { mode: AU.mode, classes: [...sel], prefer: AU.prefer, seconds: 20 }); AU.view = ''; render() } catch (x) { }
    return;
  }
  if (k == 'apply' && AU.plan) {
    try {
      const r = await srv('api_autoApply', AU.plan.remove, AU.plan.add);
      S.lessons = r.lessons; S.conflicts = r.conflicts; AU.plan = null; index(); render();
    } catch (x) { }
  }
});
/* confirm + Undo for the Apply step (hooks into the tables of Ux.html) */
UX_CONFIRM.api_autoApply = a => {
  const st = AU.plan && AU.plan.stats || {};
  return UX.ask(t('Apply the auto distribution?'), '<b>' + a[1].length + '</b> ' + t('lessons will be added') + (a[0].length ? '<br><b>' + a[0].length + '</b> ' + t('lessons will be removed first') : '') + '<br><small>' + esc(t('Lessons not placed stay as warnings in Conflicts.')) + '</small>', { yes: t('Apply'), danger: a[0].length > 0 });
};
UX_PRE.api_autoApply = a => {
  const rm = new Set(a[0]), cells = UX.cellsOf(S.lessons.filter(l => rm.has(l.id))), seen = new Set(cells.map(c => c.join('|')));
  a[1].forEach(r => { const k = r[1] + '|' + (+r[2]) + '|' + (+r[3]); if (!seen.has(k)) { seen.add(k); cells.push([r[1], +r[2], +r[3]]) } });
  return UX.lessonUndo(cells, t('Auto-distributed'));
};
</script>

<style>
.mvd{text-align:start;font-size:14px;line-height:1.5}
.mvd h4{margin:12px 0 4px;font-size:14px}
.mvd ul{margin:4px 0 0;padding-inline-start:20px}

.mvd .main{background:var(--hl);border-radius:10px;padding:8px 12px}
</style>
<script>
"use strict";
/* Move assistant. Before a lesson is moved / swapped the server (api_moveCheck, Move.gs) says what it would take:
   ok = just do it | soft = possible but breaks subject rules | plan = other lessons must move too | break = a hard rule stands in the way.
   The person approves (Apply / Move anyway) or rejects (Cancel). Needs Scripts.html + Ux.html. */
Object.assign(AR, {
  'Checking...': 'جارٍ الفحص...', 'to': 'إلى', 'max': 'الحد الأقصى',
  'To put this lesson there, other lessons must move too': 'لتثبيت هذه الحصة في المكان الجديد يجب تحريك حصص أخرى',
  'This move breaks some rules': 'هذا النقل يكسر بعض القواعد', 'This move cannot be done without breaking a hard rule': 'لا يمكن هذا النقل بدون كسر قيد أساسي',
  'The move you asked for': 'النقل المطلوب', 'These lessons must move too': 'هذه الحصص يجب أن تتحرك أيضاً', 'Rules that will be broken': 'القواعد التي سيتم كسرها', 'What stands in the way': 'ما الذي يمنع',
  'Apply the rearrangement': 'تنفيذ إعادة الترتيب', 'Only move this lesson': 'انقل هذه الحصة فقط', 'Move anyway': 'انقل رغم ذلك', 'Rearranged': 'تمت إعادة الترتيب',
  'lessons on': 'حصص يوم', 'lessons next to each other on': 'حصص متتالية يوم', 'lessons not together on': 'حصص غير متصلة يوم', 'is after the break on': 'بعد الاستراحة يوم', 'is before the break on': 'قبل الاستراحة يوم',
  'should be before the break': 'المفروض قبل الاستراحة', 'should be after the break': 'المفروض بعد الاستراحة', 'should be separate': 'المفروض منفصلة', 'should be together': 'المفروض متصلة',
  'is unavailable at': 'غير متاح في', 'would be over his maximum load': 'سيتجاوز حده الأقصى للحصص', 'that period does not exist for the class': 'هذه الحصة غير موجودة في جدول الفصل',
  'A locked lesson is in that cell': 'توجد حصة مقفولة في هذه الخانة', 'has a lesson that cannot be moved at that time': 'لديه حصة لا يمكن تحريكها في هذا الوقت', 'No place was found for': 'لم يوجد مكان بديل لـ',
  'Both moves are needed at once': 'النقلتان مطلوبتان معاً',
  'Max per day': 'الحد الأقصى في اليوم', 'Same class, same day': 'نفس الفصل في اليوم الواحد', 'Placement': 'التوقيت', 'Priority': 'الأولوية',
  'Together (double period)': 'متصلة (حصتان متتاليتان)', 'Separate (never next to each other)': 'منفصلة (ليست متتالية)', 'Before the break': 'قبل الاستراحة', 'After the break': 'بعد الاستراحة',
  'Highest': 'الأعلى', 'Normal': 'عادية', 'Lowest': 'الأدنى', 'Print without teacher names': 'الطباعة بدون أسماء المدرسين',
  'Subject rules help the auto distribution and the move assistant. A blank cell means no rule. A double period = two lessons right after each other, never across the break. When rules clash, the subject with the higher priority wins.': 'قواعد المواد يستخدمها التوزيع التلقائي ومساعد النقل. الخانة الفارغة تعني بلا قيد. الحصة المزدوجة = حصتان متتاليتان لا يفصلهما الاستراحة. عند تعارض القواعد تفوز المادة ذات الأولوية الأعلى.'
});
const mvP = (c, d, p) => {
  const sch = (S.cls.find(r => r[0] == c) || [])[1], r = S.sch.find(x => x[0] == sch && +x[1] == +d && +x[2] == +p);
  return r ? r[3] : 'P' + p;
};
const mvAt = (c, d, p) => esc(c) + ' · ' + esc(dayName(+d)) + ' ' + esc(mvP(c, d, p));
const mvL = l => '<b>' + esc(l.s) + '</b> (' + mvAt(l.c, l.d, l.p) + ')' + (l.t && l.t.length ? ' · ' + l.t.map(x => esc(tname(x))).join(', ') : '');
function mvSoft(v) {
  const dy = esc(dayName(+v.d)), h = '<b>' + esc(v.c) + ' · ' + esc(v.s) + '</b>: ';
  if (v.kind == 'max') return h + v.n + ' ' + t('lessons on') + ' ' + dy + ' (' + t('max') + ' ' + v.max + ')';
  if (v.kind == 'sep') return h + t('lessons next to each other on') + ' ' + dy + ' (' + t('should be separate') + ')';
  if (v.kind == 'consec') return h + t('lessons not together on') + ' ' + dy + ' (' + t('should be together') + ')';
  if (v.kind == 'before') return h + t('is after the break on') + ' ' + dy + ' (' + t('should be before the break') + ')';
  return h + t('is before the break on') + ' ' + dy + ' (' + t('should be after the break') + ')';
}
function mvBreak(b) {
  const me = b.lesson2 || b.lesson;
  switch (b.kind) {
    case 'blocked': return '<b>' + esc(tname(b.t)) + '</b> ' + t('is unavailable at') + ' ' + mvAt(b.lesson.c, b.lesson.d, b.lesson.p);
    case 'limit': return '<b>' + esc(tname(b.t)) + '</b> ' + t('would be over his maximum load');
    case 'noslot': return t('that period does not exist for the class') + ': ' + mvAt(b.lesson.c, b.lesson.d, b.lesson.p);
    case 'frozen-class': return t('A locked lesson is in that cell') + ': ' + mvL(b.lesson);
    case 'frozen-teacher': return '<b>' + esc(tname(b.lesson.t[0] || '')) + '</b> ' + t('has a lesson that cannot be moved at that time') + ': ' + mvL(b.lesson);
    case 'no-room': return t('No place was found for') + ' ' + mvL(b.lesson);
    default: return t('Both moves are needed at once');
  }
}
/** resolves 'go' (do the plain move), 'done' (a rearrangement was written, state is updated) or 'cancel' */
async function mvGuard(fn, args) {
  let r;
  UX.label = t('Checking...');
  try { r = await _uxSrv('api_moveCheck', fn, args) } catch (e) { return 'go' }
  if (!r || r.status == 'ok') return 'go';
  const st = r.status, moves = r.moves || [], intent = moves.filter(m => m.intent), extra = moves.filter(m => !m.intent), soft = r.soft || [], br = r.breaks || [];
  let h = '<div class="mvd">';
  if (intent.length) h += '<h4>' + t('The move you asked for') + '</h4><div class="main">' + intent.map(m => mvL({ s: m.s, c: m.from.c, d: m.from.d, p: m.from.p, t: m.t }) + ' <span class="ar">' + t('to') + '</span> ' + mvAt(m.c, m.d, m.p)).join('<br>') + '</div>';
  if (extra.length) h += '<h4>' + t('These lessons must move too') + '</h4><ul>' + extra.map(m => '<li>' + mvL({ s: m.s, c: m.from.c, d: m.from.d, p: m.from.p, t: m.t }) + ' <span class="ar">' + t('to') + '</span> ' + mvAt(m.c, m.d, m.p) + '</li>').join('') + '</ul>';
  if (br.length) h += '<h4 class="bad">' + t('What stands in the way') + '</h4><ul>' + br.map(b => '<li>' + mvBreak(b) + '</li>').join('') + '</ul>';
  if (soft.length) h += '<h4 class="bad">' + t('Rules that will be broken') + '</h4><ul>' + soft.map(v => '<li>' + mvSoft(v) + '</li>').join('') + '</ul>';
  h += '</div>';
  const plan = st == 'plan';
  const res = await Swal.fire({
    icon: 'warning', title: t(plan ? 'To put this lesson there, other lessons must move too' : st == 'soft' ? 'This move breaks some rules' : 'This move cannot be done without breaking a hard rule'), html: h, width: 640,
    showConfirmButton: true, confirmButtonText: t(plan ? 'Apply the rearrangement' : 'Move anyway'), confirmButtonColor: plan ? '#26806F' : '#d1291f',
    showDenyButton: plan, denyButtonText: t('Only move this lesson'), denyButtonColor: '#d1291f',
    showCancelButton: true, cancelButtonText: t('Cancel'), cancelButtonColor: '#5c6f77', heightAuto: false, returnFocus: false, focusCancel: !plan
  });
  if (res.isDenied) return 'go';
  if (!res.isConfirmed) return 'cancel';
  if (!plan) return 'go';
  const out = await srv('api_applyMoves', moves.map(m => ({ id: m.id, c: m.c, d: m.d, p: m.p })));
  S.lessons = out.lessons; S.conflicts = out.conflicts; index(); toast(t('Rearranged'));
  return 'done';
}
/* the rearrangement is one step in the Undo list (no extra question: the dialog above was the approval) */
UX_CONFIRM.api_applyMoves = () => true;
UX_PRE.api_applyMoves = a => {

    sheets.forEach(s => { if (!s.widths) { const w = []; s.rows.forEach(r => r.forEach((v, i) => { w[i] = Math.min(60, Math.max(w[i] || 8, String(v ?? '').length + 2)) })); s.widths = w } });

    return blob;
  }
  return { read, readXlsx, parseCsv, build, save, serial };
})();

async function sxReadLogo(file) {

  const el = e.target; if (!el || el.value !== '__newdept' || !el.dataset) return;
  let put;
  if (el.dataset.e) { const [n, r, c] = el.dataset.e.split('|'); put = v => { ed(n)[+r][+c] = v } }
  else if (el.dataset.thf) { const [i, c] = el.dataset.thf.split('|').map(Number); put = v => { ed('Teachers')[i][c] = v } }
  else return;
  const prev = el.dataset.prev && el.dataset.prev != '__newdept' ? el.dataset.prev : '';
  let name = '';
  if (window.Swal) { const r = await Swal.fire({ title: t('New department'), input: 'text', showCancelButton: true, confirmButtonText: t('Add'), cancelButtonText: t('Cancel'), heightAuto: false, returnFocus: false, inputValidator: v => !String(v).trim() ? ' ' : null }); name = r.isConfirmed ? String(r.value).trim() : '' }
  else name = (prompt(t('New department')) || '').trim();
  if (name) { const same = deptList().find(x => lc(x) == lc(name)); name = same || name; if (!same) DEPT_EXTRA.push(name); put(name) } else put(prev);
  render();
});
</script>

<script>
"use strict";
/* Identity: program name in the header, and a welcome bar with the person's picture, name, role, today's date and the clock. Needs Scripts.html. */
Object.assign(AR, Object.fromEntries(Object.entries({
  'Time Table Module': 'موديول الجداول الدراسية', 'Good morning': 'صباح الخير', 'Good afternoon': 'طاب يومك', 'Good evening': 'مساء الخير',
  'Welcome to School Operations Platform': 'مرحبًا بك في منصة العمليات المدرسية', 'Change picture': 'تغيير الصورة', 'Remove photo': 'إزالة الصورة',
  'Admin': 'مدير', 'Coordinator': 'منسّق', 'Head of department': 'رئيس القسم', 'Teacher': 'مدرس', 'Viewer': 'مشاهد',
  'Please choose an image file.': 'اختر ملف صورة.', 'view only': 'عرض فقط', 'Picture saved': 'تم حفظ الصورة', 'Picture removed': 'تمت إزالة الصورة'
}).filter(([k]) => !(k in AR))));
let PROF = { name: '', photo: '', role: '' };
const PF_ROLE = { admin: 'Admin', coordinator: 'Coordinator', hod: 'Head of department', teacher: 'Teacher', viewer: 'Viewer' };
const pfLoc = () => HL == 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB';
const pfGreet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening' };
const pfInit = n => { const w = String(n || '').trim().split(/\s+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 1)).toUpperCase() };
function pfFile() {                                   // one hidden file input for the whole page
  let f = document.getElementById('wb-file');
  if (!f) { f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; f.id = 'wb-file'; f.style.display = 'none'; document.body.appendChild(f) }
  return f;
}
function wbTick() {
  const c = document.getElementById('wb-c'), d = document.getElementById('wb-d'), n = new Date(); if (!c) return;
  c.textContent = n.toLocaleTimeString(pfLoc(), { hour: 'numeric', minute: '2-digit' });
  d.textContent = n.toLocaleDateString(pfLoc(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const g = document.getElementById('wb-g'); if (g) g.textContent = t(pfGreet()) + (PROF.name ? (HL == 'ar' ? '، ' : ', ') + PROF.name : '');
}
function wbDraw() {
  let w = document.getElementById('wb');
  if (!S || !S.role || S.register) { if (w) w.remove(); return }
  if (!w) { w = document.createElement('div'); w.id = 'wb'; document.getElementById('tabs').before(w) }
  const wk = S.set && S.set.year ? S.set.year + ' · ' + t('Week') + ': ' + weekTxt() : '';
  w.innerHTML = `<button class="av" id="wb-av" type="button" title="${esc(t('Change picture'))}">${PROF.photo ? `<img src="${esc(PROF.photo)}" alt="">` : esc(pfInit(PROF.name))}</button>
<div class="who"><b id="wb-g"></b><small>${esc(t('Welcome to School Operations Platform'))} · <span class="role">${esc(t(PF_ROLE[S.role] || 'Viewer'))}</span>${PROF.photo ? ` <button class="rm" id="wb-rm" type="button">${esc(t('Remove photo'))}</button>` : ''}</small></div>
<div class="when"><span class="clk" id="wb-c"></span><small id="wb-d"></small>${wk ? `<small>${esc(wk)}</small>` : ''}</div>`;
  wbTick();
}
function pfShrink(file) {                              // centre-crop to a 192 px square JPEG small enough for a sheet cell
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const N = 192, s = Math.min(img.width, img.height), cv = document.createElement('canvas'); cv.width = cv.height = N;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, N, N);
      let q = 0.85, out = cv.toDataURL('image/jpeg', q); while (out.length > 30000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q) }
      ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error(t('Please choose an image file.'))) };
    img.src = u;
  });
}
async function pfSave(photo) { PROF = await srv('api_saveMyPhoto', photo); wbDraw(); toast(t(photo ? 'Picture saved' : 'Picture removed')) }
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('#wb-av')) return pfFile().click();
  if (e.target.closest && e.target.closest('#wb-rm')) pfSave('').catch(() => { });
});
document.addEventListener('change', async e => {
  if (e.target.id != 'wb-file') return;
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!/^image\//.test(f.type)) return toast(t('Please choose an image file.'), 1);
  try { await pfSave(await pfShrink(f)) } catch (x) { toast(String((x && x.message) || x), 1) }
});
/* header: program name + "Time Table Module of VIA - SOP"; the year and week moved to the welcome bar */
const _pfApplyLang = applyLang;
applyLang = function () { _pfApplyLang(); const x = $('#ttl'); if (x) x.innerHTML = esc(t('School Operations Platform')) + '<span class="sop">SOP</span>' };
const _pfRender = render;
render = function () {
  if (S && S.profile) PROF = S.profile;
  _pfRender();
  const s = $('#sub'); if (s) s.innerHTML = '<span class="via">VIA - SOP</span> | ' + esc(t('Time Table Module'));
  wbDraw();
};
setInterval(wbTick, 1000); pfFile();
try { applyLang() } catch (e) { }
</script>

  ['🔤', 'english letters alphabet انجليزي حروف'], ['📖', 'reading book read قراءة كتاب قرآن'], ['📚', 'library books library مكتبة كتب'], ['✍️', 'writing handwriting كتابة خط'], ['✏️', 'pencil writing قلم كتابة'], ['📝', 'writing notes essay تعبير املاء'], ['🗣️', 'speaking language conversation french german spanish لغة محادثة فرنسي الماني'], ['💬', 'speaking language conversation محادثة'], ['🔠', 'arabic letters alphabet عربي حروف'], ['📜', 'history arabic scroll تاريخ عربي'],

  ['🎨', 'art drawing رسم فنون'], ['🖌️', 'art painting رسم فنون'], ['🎭', 'drama theatre مسرح دراما'], ['🎵', 'music موسيقى'], ['🎹', 'music piano موسيقى بيانو'], ['🎸', 'music guitar موسيقى'], ['🎤', 'music singing choir غناء كورال'],
  ['⚽', 'pe sport football رياضة كرة قدم تربية بدنية'], ['🏀', 'pe sport basketball رياضة سلة'], ['🏃', 'pe running sport جري رياضة'], ['🏊', 'pe swimming سباحة'], ['🤸', 'pe gymnastics جمباز'], ['🥋', 'pe martial karate كاراتيه'], ['♟️', 'chess logic شطرنج'],
  ['💻', 'computer ict technology كمبيوتر حاسب'], ['🖥️', 'computer ict كمبيوتر'], ['⌨️', 'computer typing keyboard كمبيوتر'], ['🤖', 'robotics coding روبوت برمجة'], ['🛠️', 'technology tools workshop تكنولوجيا ورشة'], ['⚙️', 'engineering technology هندسة'], ['🔌', 'electricity technology كهرباء'],
  ['🍳', 'home economics cooking اقتصاد منزلي طبخ'], ['🧵', 'sewing home economics خياطة'], ['❤️', 'health life skills صحة'], ['🩺', 'health science صحة'], ['🧠', 'psychology thinking عقل تفكير'], ['🌳', 'environment nature بيئة طبيعة'], ['♻️', 'environment recycle بيئة'],
  ['💼', 'business اعمال تجارة'], ['💰', 'economics money اقتصاد فلوس'], ['🏫', 'homeroom school assembly فصل طابور مدرسة'], ['👥', 'homeroom class group فصل'], ['⭐', 'activity club نشاط'], ['🎯', 'activity goal نشاط'], ['☕', 'break راحة استراحة'], ['🍽️', 'lunch break غداء']
];
const ICO = {
  pick(cur) {                                   // resolves with the chosen picture ('' = none) or undefined when closed without choosing
    return new Promise(res => {
      let chosen; const grid = q => { q = (q || '').toLowerCase().trim(); const L = SUBJ_ICONS.filter(([, k]) => !q || k.toLowerCase().includes(q)); return L.length ? L.map(([e]) => `<button type="button" data-icp="${e}"${e === cur ? ' class="on"' : ''}>${e}</button>`).join('') : `<p class="msg">${t('No picture matches.')}</p>` };
      Swal.fire({
        title: t('Subject picture'), showConfirmButton: false, showCancelButton: true, cancelButtonText: t('Close'), width: 560, heightAuto: false, scrollbarPadding: false,
        html: `<input class="icq" id="icq" placeholder="${t('Search pictures')}"><div class="icg" id="icg">${grid('')}</div>
          <div class="icu"><label class="b" style="cursor:pointer">${t('Upload your own picture')}<input type="file" id="icf" accept="image/*" style="display:none"></label><span id="icpv"></span></div><p class="icm" id="icm"></p>`,
        didOpen: () => {
          const g = document.getElementById('icg'), q = document.getElementById('icq'), f = document.getElementById('icf');
          q.addEventListener('input', () => { g.innerHTML = grid(q.value) });
          g.addEventListener('click', e => { const b = e.target.closest('[data-icp]'); if (b) { chosen = b.dataset.icp; Swal.close() } });
          f.addEventListener('change', async () => {
            const file = f.files[0]; if (!file) return;
            if (!/^image\//.test(file.type)) { document.getElementById('icm').textContent = t('The file is not an image.'); return }
            try { chosen = await ICO.shrink(file); Swal.close() } catch (x) { document.getElementById('icm').textContent = t('The file is not an image.') }
          });
          q.focus();
        }
      }).then(() => res(chosen));
    });
  },
  shrink(file) {                                // square 96 px, transparent background kept, a few KB in the sheet
    return new Promise((ok, no) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const mk = (sz, q) => { const c = document.createElement('canvas'); c.width = c.height = sz; const x = c.getContext('2d'), r = Math.min(sz / img.width, sz / img.height), w = img.width * r, h = img.height * r; x.drawImage(img, (sz - w) / 2, (sz - h) / 2, w, h); let u = c.toDataURL('image/webp', q); if (!/^data:image\/webp/.test(u)) u = c.toDataURL('image/png'); return u };
          let u = mk(96, .85); if (u.length > 9000) u = mk(72, .75); if (u.length > 9000) u = mk(56, .65);

        } catch (e) { no(e) }

      img.onerror = () => { URL.revokeObjectURL(url); no(new Error('bad image')) };

    });

});
